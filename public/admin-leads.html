<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Leads &amp; Conversations | WorkBase PH Admin</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" href="images/logo.svg?v=3" type="image/svg+xml" />
  <style>
    :root {
      --navy: #0d2240; --navy2: #1a3a5c; --orange: #f47c20; --teal: #1a8a7a;
      --gray: #6b7280; --gray-light: #9ca3af; --bg: #f5f6f8; --border: #e5e7eb;
      --st-inquired: #6b7280; --st-inquired-bg: #f3f4f6;
      --st-engaged: #2563eb; --st-engaged-bg: #eff6ff;
      --st-won: #16a34a; --st-won-bg: #f0fdf4;
      --st-canceled: #dc2626; --st-canceled-bg: #fef2f2;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: #111827; }

    /* ── LOGIN ── */
    #loginScreen { position: fixed; inset: 0; background: var(--navy); display: flex; align-items: center; justify-content: center; z-index: 9999; }
    .login-card { background: #fff; border-radius: 16px; padding: 2.5rem 2.25rem; width: 100%; max-width: 360px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
    .login-card img { height: 40px; display: block; margin: 0 auto 1.5rem; }
    .login-card h1 { font-size: 1.15rem; font-weight: 800; color: var(--navy); text-align: center; margin-bottom: 1.5rem; }
    .login-card input {
      width: 100%; font-size: 0.9rem; padding: 0.7rem 0.9rem; border-radius: 9px;
      border: 1px solid rgba(13,34,64,0.15); margin-bottom: 0.75rem; font-family: inherit;
    }
    .login-card input:focus { outline: none; border-color: var(--orange); }
    .login-card button {
      width: 100%; background: var(--orange); color: #fff; font-weight: 800; font-size: 0.92rem;
      border: none; padding: 0.75rem; border-radius: 9px; cursor: pointer; margin-top: 0.4rem;
    }
    .login-card button:hover { background: #e06d16; }
    #loginError { display: none; color: #dc2626; font-size: 0.82rem; margin-bottom: 0.75rem; text-align: center; }

    /* ── APP SHELL ── */
    header.app-header {
      background: var(--navy); padding: 0.9rem 1.5rem; display: flex; align-items: center; gap: 0.9rem;
      position: sticky; top: 0; z-index: 100;
    }
    header.app-header img { height: 30px; }
    header.app-header h1 { color: #fff; font-size: 1rem; font-weight: 800; margin-right: auto; }
    header.app-header .who { color: rgba(255,255,255,0.55); font-size: 0.8rem; }
    header.app-header button.logout {
      background: rgba(255,255,255,0.1); color: #fff; border: none; font-size: 0.8rem; font-weight: 700;
      padding: 0.45rem 1rem; border-radius: 99px; cursor: pointer;
    }
    header.app-header button.logout:hover { background: rgba(255,255,255,0.18); }

    main { max-width: 1280px; margin: 0 auto; padding: 1.75rem 1.5rem 4rem; }

    /* ── INSIGHTS CARDS ── */
    .insights-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 1rem; margin-bottom: 1.75rem; }
    .stat-card { background: #fff; border: 1px solid var(--border); border-radius: 14px; padding: 1.1rem 1.25rem; }
    .stat-card .num { font-size: 1.7rem; font-weight: 900; color: var(--navy); line-height: 1; margin-bottom: 0.3rem; }
    .stat-card .lbl { font-size: 0.78rem; color: var(--gray); font-weight: 600; }
    .stat-card.attn .num { color: var(--orange); }
    .stat-card .sub { font-size: 0.72rem; color: var(--gray-light); margin-top: 0.3rem; }

    /* ── FILTERS ── */
    .filters-bar { display: flex; gap: 0.75rem; margin-bottom: 1.25rem; flex-wrap: wrap; align-items: center; }
    .filters-bar input, .filters-bar select {
      font-family: inherit; font-size: 0.85rem; padding: 0.55rem 0.85rem; border-radius: 9px;
      border: 1px solid var(--border); background: #fff;
    }
    .filters-bar input { flex: 1; min-width: 200px; }
    .filters-bar input:focus, .filters-bar select:focus { outline: none; border-color: var(--orange); }

    /* ── PIPELINE BOARD ── */
    .pipeline-board { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem; align-items: start; }
    @media (max-width: 900px) { .pipeline-board { grid-template-columns: 1fr 1fr; } }
    @media (max-width: 560px) { .pipeline-board { grid-template-columns: 1fr; } }
    .pipeline-col { background: #eef0f3; border-radius: 14px; padding: 0.9rem; min-height: 120px; }
    .pipeline-col-head { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.3rem; padding: 0 0.15rem; }
    .pipeline-col-desc { font-size: 0.72rem; color: var(--gray); line-height: 1.4; margin-bottom: 0.85rem; padding: 0 0.15rem; }
    .pipeline-col-dot { width: 9px; height: 9px; border-radius: 50%; }
    .pipeline-col-title { font-size: 0.82rem; font-weight: 800; color: var(--navy); }
    .pipeline-col-count { margin-left: auto; font-size: 0.75rem; font-weight: 700; color: var(--gray); background: #fff; padding: 0.1rem 0.55rem; border-radius: 99px; }
    .pipeline-cards { display: flex; flex-direction: column; gap: 0.65rem; }
    .lead-card {
      background: #fff; border: 1px solid var(--border); border-radius: 12px; padding: 0.9rem 1rem;
      cursor: pointer; transition: box-shadow 0.15s, transform 0.15s;
    }
    .lead-card:hover { box-shadow: 0 6px 18px rgba(13,34,64,0.1); transform: translateY(-1px); }
    .lead-card .top-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 0.5rem; margin-bottom: 0.4rem; }
    .lead-card .name { font-weight: 700; font-size: 0.88rem; color: var(--navy); }
    .lead-card .email { font-size: 0.72rem; color: var(--gray); margin-top: 0.1rem; }
    .lead-card .summary { font-size: 0.78rem; color: #374151; line-height: 1.5; margin: 0.45rem 0; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
    .lead-card .meta-row { display: flex; align-items: center; justify-content: space-between; margin-top: 0.5rem; gap: 0.5rem; }
    .lead-card .time { font-size: 0.7rem; color: var(--gray-light); }
    .svc-badge { display: inline-block; font-size: 0.65rem; font-weight: 800; letter-spacing: 0.3px; padding: 0.18rem 0.55rem; border-radius: 99px; white-space: nowrap; }
    .svc-badge.founder { background: rgba(26,138,122,0.12); color: var(--teal); }
    .svc-badge.dfy { background: rgba(244,124,32,0.12); color: var(--orange); }
    .waiting-flag { font-size: 0.68rem; font-weight: 800; color: #dc2626; background: #fef2f2; padding: 0.15rem 0.5rem; border-radius: 99px; }
    .followup-flag { font-size: 0.68rem; font-weight: 700; color: var(--gray); background: #f3f4f6; padding: 0.15rem 0.5rem; border-radius: 99px; white-space: nowrap; }
    .followup-flag.due { color: #b45309; background: #fef3c7; }
    .status-select {
      font-family: inherit; font-size: 0.72rem; font-weight: 700; padding: 0.3rem 0.5rem; border-radius: 7px;
      border: 1px solid var(--border); background: #fff; cursor: pointer;
    }
    .empty-col { font-size: 0.78rem; color: var(--gray-light); text-align: center; padding: 1.5rem 0.5rem; }

    /* ── DETAIL SLIDE-OVER ── */
    #detailOverlay { position: fixed; inset: 0; background: rgba(13,34,64,0.35); z-index: 200; }
    #detailPanel {
      position: fixed; top: 0; right: 0; bottom: 0; width: 420px; max-width: 92vw; background: #fff;
      z-index: 201; box-shadow: -12px 0 40px rgba(0,0,0,0.2); display: flex; flex-direction: column;
    }
    .detail-head { background: var(--navy); padding: 1.25rem 1.4rem; flex-shrink: 0; }
    .detail-head .close-btn { float: right; background: none; border: none; color: rgba(255,255,255,0.6); font-size: 1.4rem; cursor: pointer; line-height: 1; }
    .detail-head .close-btn:hover { color: #fff; }
    .detail-head .d-name { color: #fff; font-weight: 800; font-size: 1.05rem; margin-bottom: 0.15rem; }
    .detail-head .d-email { color: rgba(255,255,255,0.6); font-size: 0.82rem; margin-bottom: 0.3rem; }
    .detail-head .d-email a { color: rgba(255,255,255,0.8); }
    .detail-head .d-inquired { color: rgba(255,255,255,0.45); font-size: 0.72rem; margin-bottom: 0.8rem; }
    .detail-head .d-controls { display: flex; align-items: center; gap: 0.6rem; }

    .notes-section { background: #fffbeb; border: 1px solid #fde68a; border-radius: 12px; padding: 0.9rem 1rem; margin-bottom: 1.25rem; }
    .notes-section textarea {
      width: 100%; font-family: inherit; font-size: 0.83rem; padding: 0.55rem 0.7rem; border-radius: 8px;
      border: 1px solid var(--border); resize: vertical; margin: 0.4rem 0 0.6rem; color: #111827;
    }
    .notes-section textarea:focus { outline: none; border-color: var(--orange); }
    .notes-row { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; }
    .notes-row input[type="date"] {
      font-family: inherit; font-size: 0.8rem; padding: 0.4rem 0.6rem; border-radius: 7px; border: 1px solid var(--border);
    }
    .notes-row button {
      background: var(--navy); color: #fff; border: none; font-size: 0.78rem; font-weight: 700;
      padding: 0.4rem 0.9rem; border-radius: 7px; cursor: pointer;
    }
    .notes-row button:hover { background: var(--navy2); }
    .notes-saved-msg { font-size: 0.72rem; color: var(--teal); margin-top: 0.4rem; height: 1em; }

    .detail-body { flex: 1; overflow-y: auto; padding: 1.25rem 1.4rem; }
    .detail-field { margin-bottom: 1rem; }
    .detail-field .f-label { font-size: 0.68rem; font-weight: 800; letter-spacing: 0.5px; text-transform: uppercase; color: var(--gray-light); margin-bottom: 0.25rem; }
    .detail-field .f-value { font-size: 0.88rem; color: #111827; line-height: 1.6; white-space: pre-wrap; }

    .thread-messages { display: flex; flex-direction: column; gap: 0.6rem; }
    .thread-bubble { max-width: 85%; padding: 0.6rem 0.85rem; border-radius: 14px; font-size: 0.85rem; line-height: 1.5; white-space: pre-wrap; word-wrap: break-word; }
    .thread-bubble.visitor { align-self: flex-start; background: #f3f4f6; color: #111827; border-bottom-left-radius: 4px; }
    .thread-bubble.admin { align-self: flex-end; background: var(--orange); color: #fff; border-bottom-right-radius: 4px; }
    .thread-time { font-size: 0.65rem; color: var(--gray-light); margin-top: 0.15rem; }

    .detail-reply-row { flex-shrink: 0; border-top: 1px solid var(--border); padding: 0.85rem 1.1rem; display: flex; gap: 0.55rem; }
    .detail-reply-row input {
      flex: 1; font-family: inherit; font-size: 0.85rem; padding: 0.6rem 0.85rem; border-radius: 99px;
      border: 1px solid var(--border);
    }
    .detail-reply-row input:focus { outline: none; border-color: var(--orange); }
    .detail-reply-row button {
      background: var(--orange); color: #fff; border: none; width: 38px; height: 38px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0;
    }
    .detail-reply-row button:hover { background: #e06d16; }

    .loading-note, .empty-note { text-align: center; color: var(--gray); font-size: 0.85rem; padding: 3rem 1rem; }
  </style>
</head>
<body>

<div id="loginScreen">
  <div class="login-card">
    <img src="images/logo.svg?v=3" alt="WorkBase PH" />
    <h1>Leads &amp; Conversations</h1>
    <div id="loginError">Invalid login, or this account doesn't have admin access.</div>
    <input type="email" id="loginEmail" placeholder="Email" autocomplete="username" />
    <input type="password" id="loginPassword" placeholder="Password" autocomplete="current-password" />
    <button onclick="doLogin()">Log In</button>
  </div>
</div>

<div id="app" style="display:none;">
  <header class="app-header">
    <img src="images/logo.svg?v=3" alt="WorkBase PH" />
    <h1>Leads &amp; Conversations</h1>
    <span class="who" id="whoLabel"></span>
    <button class="logout" onclick="doLogout()">Log Out</button>
  </header>

  <main>
    <div class="insights-grid" id="insightsGrid"></div>

    <div class="filters-bar">
      <input type="text" id="searchInput" placeholder="Search by name or email…" oninput="onSearchInput()" />
      <select id="serviceFilter" onchange="loadLeads()">
        <option value="all">All services</option>
        <option value="Launch Startup Services">Launch Startup Services</option>
        <option value="Done-For-You Hiring">Done-For-You Hiring</option>
      </select>
    </div>

    <div class="pipeline-board" id="pipelineBoard"></div>
  </main>
</div>

<div id="detailOverlay" style="display:none;" onclick="closeDetail()"></div>
<div id="detailPanel" style="display:none;"></div>

<script>
const STAGES = [
  { key: 'inquired', label: 'Inquired', color: 'var(--st-inquired)', desc: "Just came in — hasn't been contacted yet." },
  { key: 'engaged',  label: 'Engaged',  color: 'var(--st-engaged)',  desc: "We're actively talking with them." },
  { key: 'won',      label: 'Won',      color: 'var(--st-won)',      desc: 'Converted into a paying client.' },
  { key: 'canceled', label: 'Canceled', color: 'var(--st-canceled)', desc: "Didn't move forward." },
];
const STATUS_LABELS = { inquired: 'Inquired', engaged: 'Engaged', won: 'Won', canceled: 'Canceled' };

let token = localStorage.getItem('admin_token');
let adminRole = localStorage.getItem('admin_role') || '';
let allLeads = [];
let searchTimer = null;
let detailPollTimer = null;
let openLeadId = null;

(async function boot() {
  if (!token) return;
  try {
    const me = await api('/api/auth/me');
    if (!me.admin_role) { doLogout(); return; }
    adminRole = me.admin_role;
    localStorage.setItem('admin_role', adminRole);
    document.getElementById('whoLabel').textContent = me.email + ' · ' + (adminRole === 'super_admin' ? 'Super Admin' : 'Reviewer Admin');
    showApp();
  } catch { doLogout(); }
})();

function showApp() {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  loadInsights();
  loadLeads();
  setInterval(() => { loadInsights(); loadLeads(true); }, 20000);
}

async function doLogin() {
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  const errEl = document.getElementById('loginError');
  errEl.style.display = 'none';
  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password }),
    });
    const data = await res.json();
    if (!res.ok || !data.user || !data.user.admin_role) {
      errEl.style.display = 'block';
      return;
    }
    token = data.token;
    adminRole = data.user.admin_role;
    localStorage.setItem('admin_token', token);
    localStorage.setItem('admin_role', adminRole);
    document.getElementById('whoLabel').textContent = data.user.email + ' · ' + (adminRole === 'super_admin' ? 'Super Admin' : 'Reviewer Admin');
    showApp();
  } catch {
    errEl.style.display = 'block';
  }
}
document.getElementById('loginPassword').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

function doLogout() {
  localStorage.removeItem('admin_token');
  localStorage.removeItem('admin_role');
  token = null; adminRole = '';
  document.getElementById('app').style.display = 'none';
  document.getElementById('loginScreen').style.display = 'flex';
}

async function api(path, opts = {}) {
  const res = await fetch(path, {
    ...opts,
    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}`, ...(opts.headers || {}) },
  });
  if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || 'API error');
  return res.json();
}

function esc(s) { return String(s || '').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

function timeAgo(iso) {
  const diff = Date.now() - new Date(iso).getTime();
  const m = Math.floor(diff / 60000);
  if (m < 1) return 'just now';
  if (m < 60) return m + 'm ago';
  const h = Math.floor(m / 60);
  if (h < 24) return h + 'h ago';
  const d = Math.floor(h / 24);
  return d + 'd ago';
}

function svcBadgeClass(service) {
  return service === 'Done-For-You Hiring' ? 'dfy' : 'founder';
}

function formatShortDate(dateStr) {
  return new Date(dateStr + 'T00:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
}

function followUpBadge(l) {
  if (!l.follow_up_at) return '';
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const due = new Date(l.follow_up_at + 'T00:00:00') <= today;
  return `<span class="followup-flag${due ? ' due' : ''}">${due ? 'Follow up due' : 'Follow up ' + formatShortDate(l.follow_up_at)}</span>`;
}

// ── Insights ─────────────────────────────────────────────────────────────────
async function loadInsights() {
  try {
    const s = await api('/api/admin-leads/insights');
    const founderCount = s.serviceCounts['Launch Startup Services'] || 0;
    const dfyCount = s.serviceCounts['Done-For-You Hiring'] || 0;
    document.getElementById('insightsGrid').innerHTML = `
      <div class="stat-card">
        <div class="num">${s.total}</div>
        <div class="lbl">Total Inquiries</div>
        <div class="sub">${founderCount} Launch Startup · ${dfyCount} Done-For-You</div>
      </div>
      <div class="stat-card">
        <div class="num">${s.last7}</div>
        <div class="lbl">New This Week</div>
      </div>
      <div class="stat-card${s.awaitingReply > 0 ? ' attn' : ''}">
        <div class="num">${s.awaitingReply}</div>
        <div class="lbl">Awaiting Our Reply</div>
      </div>
      <div class="stat-card">
        <div class="num">${s.conversionRate === null ? '—' : s.conversionRate + '%'}</div>
        <div class="lbl">Won vs. Canceled</div>
        <div class="sub">${s.statusCounts.won} won · ${s.statusCounts.canceled} canceled</div>
      </div>
    `;
  } catch (e) { console.error(e); }
}

// ── Pipeline / Leads list ───────────────────────────────────────────────────
function onSearchInput() {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(loadLeads, 350);
}

async function loadLeads(silent) {
  try {
    const search = document.getElementById('searchInput').value.trim();
    const service = document.getElementById('serviceFilter').value;
    const params = new URLSearchParams();
    if (search) params.set('search', search);
    if (service !== 'all') params.set('service', service);
    const data = await api('/api/admin-leads?' + params.toString());
    allLeads = data.leads;
    renderBoard();
  } catch (e) { if (!silent) console.error(e); }
}

function renderBoard() {
  const board = document.getElementById('pipelineBoard');
  board.innerHTML = STAGES.map(stage => {
    const leads = allLeads.filter(l => l.status === stage.key);
    return `
      <div class="pipeline-col">
        <div class="pipeline-col-head">
          <span class="pipeline-col-dot" style="background:${stage.color}"></span>
          <span class="pipeline-col-title">${stage.label}</span>
          <span class="pipeline-col-count">${leads.length}</span>
        </div>
        <div class="pipeline-col-desc">${stage.desc}</div>
        <div class="pipeline-cards">
          ${leads.length ? leads.map(leadCardHtml).join('') : '<div class="empty-col">No leads here</div>'}
        </div>
      </div>`;
  }).join('');
}

function leadCardHtml(l) {
  const preview = l.source === 'chat' && l.last_message ? l.last_message : l.summary;
  const waiting = l.source === 'chat' && l.last_sender === 'visitor' && l.status !== 'won' && l.status !== 'canceled';
  return `
    <div class="lead-card" onclick="openDetail(${l.id})">
      <div class="top-row">
        <div>
          <div class="name">${esc(l.name || 'No name')}</div>
          <div class="email">${esc(l.email)}</div>
        </div>
        <span class="svc-badge ${svcBadgeClass(l.service)}">${l.service === 'Done-For-You Hiring' ? 'DFY' : 'Launch'}</span>
      </div>
      <div class="summary">${esc(preview)}</div>
      <div class="meta-row">
        <span class="time">${timeAgo(l.created_at)}</span>
        ${waiting ? '<span class="waiting-flag">Needs reply</span>' : followUpBadge(l)}
      </div>
      <div class="meta-row" onclick="event.stopPropagation()">
        <select class="status-select" onchange="changeStatus(${l.id}, this.value)">
          ${STAGES.map(s => `<option value="${s.key}" ${s.key === l.status ? 'selected' : ''}>${s.label}</option>`).join('')}
        </select>
      </div>
    </div>`;
}

async function changeStatus(id, status) {
  try {
    await api(`/api/admin-leads/${id}/status`, { method: 'PATCH', body: JSON.stringify({ status }) });
    loadLeads(); loadInsights();
  } catch (e) { alert('Could not update status: ' + e.message); loadLeads(); }
}

// ── Detail slide-over ────────────────────────────────────────────────────────
let renderedMsgIds = new Set();

async function openDetail(id) {
  openLeadId = id;
  renderedMsgIds = new Set();
  document.getElementById('detailOverlay').style.display = 'block';
  document.getElementById('detailPanel').style.display = 'flex';
  document.getElementById('detailPanel').innerHTML = '<div class="loading-note">Loading…</div>';
  await loadDetail(true);
  clearInterval(detailPollTimer);
  // Poll for new messages only — never re-run the full render on a timer, or it
  // wipes out whatever the admin is currently typing in the reply box.
  detailPollTimer = setInterval(pollThreadOnly, 4000);
}

async function pollThreadOnly() {
  if (!openLeadId) return;
  try {
    const data = await api(`/api/admin-leads/${openLeadId}`);
    if (!data.thread) return;
    const list = document.getElementById('threadMessages');
    if (!list) return;
    let appended = false;
    data.thread.forEach(m => {
      if (renderedMsgIds.has(m.id)) return;
      renderedMsgIds.add(m.id);
      const wrap = document.createElement('div');
      wrap.innerHTML = `<div class="thread-bubble ${m.sender === 'admin' ? 'admin' : 'visitor'}">${esc(m.message)}</div><div class="thread-time" style="text-align:${m.sender === 'admin' ? 'right' : 'left'}">${timeAgo(m.created_at)}</div>`;
      list.appendChild(wrap);
      appended = true;
    });
    if (appended) {
      const body = document.getElementById('detailBody');
      if (body) body.scrollTop = body.scrollHeight;
      loadLeads(true);
    }
  } catch (e) { /* silent — next tick retries */ }
}

function closeDetail() {
  clearInterval(detailPollTimer);
  detailPollTimer = null;
  openLeadId = null;
  document.getElementById('detailOverlay').style.display = 'none';
  document.getElementById('detailPanel').style.display = 'none';
}

async function loadDetail(scrollToBottom) {
  if (!openLeadId) return;
  try {
    const data = await api(`/api/admin-leads/${openLeadId}`);
    renderDetail(data, scrollToBottom);
  } catch (e) { console.error(e); }
}

function renderDetail(data, scrollToBottom) {
  const l = data.lead;
  const statusOptions = STAGES.map(s => `<option value="${s.key}" ${s.key === l.status ? 'selected' : ''}>${s.label}</option>`).join('');

  let bodyHtml = '';
  if (data.thread) {
    data.thread.forEach(m => renderedMsgIds.add(m.id));
    bodyHtml = `<div class="thread-messages" id="threadMessages">${data.thread.map(m => `
      <div>
        <div class="thread-bubble ${m.sender === 'admin' ? 'admin' : 'visitor'}">${esc(m.message)}</div>
        <div class="thread-time" style="text-align:${m.sender === 'admin' ? 'right' : 'left'}">${timeAgo(m.created_at)}</div>
      </div>`).join('')}</div>`;
  } else if (data.detail) {
    const d = data.detail;
    const rows = Object.entries(d)
      .filter(([k]) => !['id'].includes(k))
      .map(([k, v]) => {
        if (!v) return '';
        const label = k.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
        const val = k === 'submitted_at' ? new Date(v).toLocaleString('en-PH') : v;
        return `<div class="detail-field"><div class="f-label">${esc(label)}</div><div class="f-value">${esc(val)}</div></div>`;
      }).join('');
    bodyHtml = rows;
  } else {
    bodyHtml = '<div class="empty-note">No additional details.</div>';
  }

  const inquiredStr = new Date(l.created_at).toLocaleString('en-PH', { month: 'short', day: 'numeric', year: 'numeric', hour: 'numeric', minute: '2-digit' });
  const followUpVal = l.follow_up_at ? new Date(l.follow_up_at).toISOString().slice(0, 10) : '';

  document.getElementById('detailPanel').innerHTML = `
    <div class="detail-head">
      <button class="close-btn" onclick="closeDetail()">&times;</button>
      <div class="d-name">${esc(l.name || 'No name')}</div>
      <div class="d-email"><a href="mailto:${esc(l.email)}">${esc(l.email)}</a></div>
      <div class="d-inquired">Inquired ${inquiredStr}</div>
      <div class="d-controls">
        <span class="svc-badge ${svcBadgeClass(l.service)}" style="background:rgba(255,255,255,0.15);color:#fff">${esc(l.service)}</span>
        <select class="status-select" onchange="changeStatus(${l.id}, this.value); closeDetail(); openDetail(${l.id})">${statusOptions}</select>
      </div>
    </div>
    <div class="detail-body" id="detailBody">
      <div class="notes-section">
        <div class="f-label">Internal Note (visible to all admins)</div>
        <textarea id="notesInput" rows="2" placeholder="Add a note for the team…">${esc(l.notes || '')}</textarea>
        <div class="notes-row">
          <label class="f-label" style="margin:0">Follow up on</label>
          <input type="date" id="followUpInput" value="${followUpVal}" />
          <button type="button" onclick="saveNotes(${l.id})">Save</button>
        </div>
        <div id="notesSavedMsg" class="notes-saved-msg"></div>
      </div>
      ${bodyHtml}
    </div>
    ${data.thread ? `
      <form class="detail-reply-row" onsubmit="return sendDetailReply(event, ${l.id})">
        <input type="text" id="detailReplyInput" placeholder="Type a reply…" autocomplete="off" />
        <button type="submit" aria-label="Send">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7z"/></svg>
        </button>
      </form>` : ''}
  `;

  if (data.thread && scrollToBottom !== false) {
    const body = document.getElementById('detailBody');
    body.scrollTop = body.scrollHeight;
  }
}

async function saveNotes(leadId) {
  const notes = document.getElementById('notesInput').value;
  const followUpAt = document.getElementById('followUpInput').value || null;
  const msgEl = document.getElementById('notesSavedMsg');
  try {
    await api(`/api/admin-leads/${leadId}/notes`, { method: 'PATCH', body: JSON.stringify({ notes, followUpAt }) });
    msgEl.textContent = 'Saved.';
    setTimeout(() => { if (msgEl) msgEl.textContent = ''; }, 2500);
    loadLeads(true);
  } catch (err) {
    msgEl.textContent = 'Could not save: ' + err.message;
    msgEl.style.color = '#dc2626';
  }
}

async function sendDetailReply(e, leadId) {
  e.preventDefault();
  const input = document.getElementById('detailReplyInput');
  const text = input.value.trim();
  if (!text) return false;
  input.disabled = true;
  try {
    await api(`/api/admin-leads/${leadId}/reply`, { method: 'POST', body: JSON.stringify({ message: text }) });
    input.value = '';
    await loadDetail(true);
    loadLeads(true); loadInsights();
  } catch (err) {
    alert('Could not send reply: ' + err.message);
  }
  input.disabled = false;
  const freshInput = document.getElementById('detailReplyInput');
  if (freshInput) freshInput.focus();
  return false;
}
</script>

</body>
</html>
