<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chat Reply | WorkBase PH</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" href="images/logo.svg?v=3" type="image/svg+xml" />
  <style>
    :root { --navy:#0d2240; --orange:#f47c20; --teal:#1a8a7a; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f3f4f6; color: #111827; height: 100vh; display: flex; flex-direction: column; }

    header { background: var(--navy); padding: 0.9rem 1.25rem; display: flex; align-items: center; gap: 0.75rem; flex-shrink: 0; }
    header img { height: 28px; width: auto; }
    header .ctx { color: rgba(255,255,255,0.6); font-size: 0.8rem; margin-left: auto; text-align: right; }
    header .ctx strong { color: #fff; font-weight: 700; }

    #loadingState, #errorState { flex: 1; display: flex; align-items: center; justify-content: center; text-align: center; padding: 2rem; color: #6b7280; font-size: 0.95rem; }
    #errorState { display: none; flex-direction: column; gap: 0.5rem; }
    #errorState .big { font-size: 1.1rem; font-weight: 800; color: #0d2240; }

    #chatApp { display: none; flex: 1; flex-direction: column; min-height: 0; }
    #messages { flex: 1; overflow-y: auto; padding: 1.25rem; display: flex; flex-direction: column; gap: 0.65rem; max-width: 720px; width: 100%; margin: 0 auto; }
    .bubble { max-width: 75%; padding: 0.7rem 1rem; border-radius: 16px; font-size: 0.92rem; line-height: 1.55; white-space: pre-wrap; word-wrap: break-word; }
    .bubble.visitor { align-self: flex-start; background: #fff; color: #111827; border: 1px solid #e5e7eb; border-bottom-left-radius: 4px; }
    .bubble.admin { align-self: flex-end; background: var(--orange); color: #fff; border-bottom-right-radius: 4px; }
    .bubble-meta { font-size: 0.68rem; color: #9ca3af; margin-top: 0.2rem; }

    form#replyForm { flex-shrink: 0; border-top: 1px solid #e5e7eb; background: #fff; padding: 0.85rem 1.25rem; display: flex; gap: 0.6rem; max-width: 720px; width: 100%; margin: 0 auto; }
    form#replyForm input { flex: 1; font-family: inherit; font-size: 0.92rem; padding: 0.7rem 1rem; border-radius: 99px; border: 1px solid rgba(13,34,64,0.15); }
    form#replyForm input:focus { outline: none; border-color: var(--orange); }
    form#replyForm button { background: var(--orange); color: #fff; border: none; width: 42px; height: 42px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }
    form#replyForm button:hover { background: #e06d16; }
    form#replyForm button:disabled { opacity: 0.5; cursor: default; }
  </style>
</head>
<body>

<header>
  <img src="images/logo.svg?v=3" alt="WorkBase PH" />
  <div class="ctx" id="ctxLabel"></div>
</header>

<div id="loadingState">Loading chat…</div>

<div id="errorState">
  <div class="big">This chat link is invalid or has expired.</div>
  <div>Check that you copied the full link from the notification email.</div>
</div>

<div id="chatApp">
  <div id="messages"></div>
  <form id="replyForm">
    <input type="text" id="replyInput" placeholder="Type a reply…" autocomplete="off" />
    <button type="submit" aria-label="Send">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7z"/></svg>
    </button>
  </form>
</div>

<script>
  const params = new URLSearchParams(location.search);
  const chatId = params.get('id');
  const chatToken = params.get('token');
  let lastMsgId = 0;
  let pollTimer = null;

  function fmtTime(iso) {
    try { return new Date(iso).toLocaleString('en-PH', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }); }
    catch (e) { return ''; }
  }

  function renderMessage(m) {
    const list = document.getElementById('messages');
    const bubble = document.createElement('div');
    bubble.className = 'bubble ' + (m.sender === 'admin' ? 'admin' : 'visitor');
    bubble.textContent = m.message;
    const meta = document.createElement('div');
    meta.className = 'bubble-meta';
    meta.textContent = fmtTime(m.created_at);
    const wrap = document.createElement('div');
    wrap.style.display = 'flex';
    wrap.style.flexDirection = 'column';
    wrap.style.alignItems = m.sender === 'admin' ? 'flex-end' : 'flex-start';
    wrap.appendChild(bubble);
    wrap.appendChild(meta);
    list.appendChild(wrap);
    list.scrollTop = list.scrollHeight;
    if (m.id > lastMsgId) lastMsgId = m.id;
  }

  async function loadMessages() {
    try {
      const res = await fetch(`/api/chat-request/${chatId}/messages?token=${encodeURIComponent(chatToken)}&after=${lastMsgId}&viewer=admin`);
      const data = await res.json();
      if (!data.ok) throw new Error(data.error || 'Failed to load');
      data.messages.forEach(renderMessage);
      if (data.name || data.page) {
        document.getElementById('ctxLabel').innerHTML = `<strong>${(data.name || 'Someone').replace(/</g,'&lt;')}</strong> &middot; ${(data.page || '').replace(/</g,'&lt;')}`;
      }
      return true;
    } catch (err) {
      return false;
    }
  }

  async function init() {
    if (!chatId || !chatToken) {
      document.getElementById('loadingState').style.display = 'none';
      document.getElementById('errorState').style.display = 'flex';
      return;
    }
    const ok = await loadMessages();
    document.getElementById('loadingState').style.display = 'none';
    if (!ok) {
      document.getElementById('errorState').style.display = 'flex';
      return;
    }
    document.getElementById('chatApp').style.display = 'flex';
    document.getElementById('replyInput').focus();
    pollTimer = setInterval(loadMessages, 3500);
  }

  document.getElementById('replyForm').addEventListener('submit', async function (e) {
    e.preventDefault();
    const input = document.getElementById('replyInput');
    const text = input.value.trim();
    if (!text) return;
    const btn = e.target.querySelector('button');
    input.disabled = true;
    btn.disabled = true;
    try {
      const res = await fetch(`/api/chat-request/${chatId}/reply`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token: chatToken, message: text }),
      });
      const data = await res.json();
      if (data.ok) {
        input.value = '';
        await loadMessages();
      }
    } catch (err) { /* leave text in the box so the rep can retry */ }
    input.disabled = false;
    btn.disabled = false;
    input.focus();
  });

  init();
</script>

</body>
</html>
