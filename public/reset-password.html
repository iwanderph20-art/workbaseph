<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Reset Password — WorkBase PH</title>
  <link rel="icon" href="images/logo.svg?v=3" type="image/svg+xml"/>
  <link rel="stylesheet" href="css/styles.css?v=2"/>
</head>
<body>
<nav class="navbar">
  <div class="nav-inner">
    <a href="index.html" class="nav-logo">
      <img src="images/logo.svg?v=3" alt="WorkBase PH" style="height:136px;width:auto"/>
    </a>
  </div>
</nav>

<main style="min-height:calc(100vh - 73px);display:flex;align-items:center;justify-content:center;padding:3rem 1.5rem;background:var(--bg)">
  <div style="width:100%;max-width:440px">
    <div class="text-center mb-3">
      <div style="font-size:2.2rem;font-weight:900;color:var(--navy);margin-bottom:0.75rem;letter-spacing:-0.5px">Work<span style="color:var(--orange)">Base</span>PH</div>
      <h1 style="font-size:1.75rem;margin-bottom:0.25rem">Choose a new password</h1>
      <p class="text-gray">Enter your new password below.</p>
    </div>

    <div id="alertBox"></div>

    <div class="form-card" id="resetForm">
      <div class="form-group">
        <label class="form-label" for="newPassword">New Password</label>
        <div style="position:relative">
          <input type="password" id="newPassword" placeholder="At least 6 characters" autocomplete="new-password" style="width:100%;box-sizing:border-box"/>
          <button type="button" onclick="togglePass('newPassword')" style="position:absolute;right:0.75rem;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--gray);font-size:1.1rem">👁</button>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label" for="confirmPassword">Confirm Password</label>
        <input type="password" id="confirmPassword" placeholder="Repeat your new password" autocomplete="new-password" style="width:100%;box-sizing:border-box"/>
      </div>
      <button onclick="submitReset()" id="submitBtn" class="btn btn-primary w-full" style="margin-top:0.5rem">Set New Password</button>
    </div>

    <p class="text-center mt-3 text-gray" style="font-size:0.95rem">
      Remembered it? <a href="login.html" style="font-weight:600">Log in →</a>
    </p>
  </div>
</main>

<script src="js/app.js?v=2"></script>
<script>
  const token = new URLSearchParams(window.location.search).get('token');
  if (!token) {
    document.getElementById('alertBox').innerHTML = '<div class="alert alert-error" style="margin-bottom:1rem">Invalid or missing reset link. Please request a new one from the <a href="login.html" style="color:inherit;font-weight:700">login page</a>.</div>';
    document.getElementById('resetForm').style.display = 'none';
  }

  function togglePass(id) {
    const el = document.getElementById(id);
    el.type = el.type === 'password' ? 'text' : 'password';
  }

  async function submitReset() {
    const btn = document.getElementById('submitBtn');
    const alertBox = document.getElementById('alertBox');
    const password = document.getElementById('newPassword').value;
    const confirm = document.getElementById('confirmPassword').value;
    alertBox.innerHTML = '';

    if (password.length < 6) { showAlert(alertBox, 'Password must be at least 6 characters.'); return; }
    if (password !== confirm) { showAlert(alertBox, 'Passwords do not match.'); return; }

    setLoading(btn, true, 'Set New Password');
    try {
      await apiFetch('/auth/reset-password', {
        method: 'POST',
        body: JSON.stringify({ token, password }),
      });
      showAlert(alertBox, 'Password updated! Redirecting you to log in…', 'success');
      document.getElementById('resetForm').style.display = 'none';
      setTimeout(() => window.location.href = 'login.html', 2000);
    } catch (err) {
      showAlert(alertBox, err.message || 'This link may have expired. Please request a new one.');
      setLoading(btn, false, 'Set New Password');
    }
  }
</script>
</body>
</html>
