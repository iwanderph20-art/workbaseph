  <meta charset="UTF-8" />

<body>

<!-- NAVBAR -->
<nav class="navbar">
  <div class="nav-inner">
    <a href="index.html" class="nav-logo">
      <img src="images/logo.svg?v=3" alt="WorkBase PH" style="height:136px;width:auto" />

      <a href="index.html#pricing">Pricing</a>
    </div>

    <button class="hamburger" id="hamburger" aria-label="Menu">

<!-- LOGIN PAGE -->
<main style="min-height:calc(100vh - 73px);display:flex;align-items:center;justify-content:center;padding:3rem 1.5rem;background:var(--bg)">
  <div style="width:100%;max-width:440px">
    <!-- Logo -->
    <div class="text-center mb-3">
      <div style="font-size:2.2rem;font-weight:900;color:var(--navy);margin-bottom:0.75rem;letter-spacing:-0.5px">Work<span style="color:var(--orange)">Base</span>PH</div>
      <h1 style="font-size:1.75rem;margin-bottom:0.25rem">Welcome Back</h1>
      <p class="text-gray">Log in to your WorkBasePH account</p>
    </div>

    <!-- Alert -->
    <div id="alertBox"></div>

    <!-- Form -->
    <div class="form-card">
      <form id="loginForm">
        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" required autocomplete="email" />
        </div>
        <div class="form-group">
          <label class="form-label" for="password">
            Password
            <a href="#" onclick="showForgotModal();return false" style="float:right;font-weight:400;font-size:0.85rem;color:var(--orange)">Forgot password?</a>
          </label>
          <div style="position:relative">
            <input type="password" id="password" name="password" placeholder="Enter your password" required autocomplete="current-password" />
            <button type="button" onclick="togglePass()" style="position:absolute;right:0.75rem;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--gray);font-size:1.1rem" title="Show/hide password">👁</button>
          </div>
        </div>
        <button type="submit" class="btn btn-primary w-full" id="submitBtn" style="margin-top:0.5rem">
          Log In
        </button>
      </form>

      <div style="text-align:center;margin-top:1rem">
        <a href="#" onclick="showForgotModal();return false" style="color:var(--orange);font-weight:600;font-size:0.9rem">Forgot your password?</a>
      </div>

    </div>

    <p class="text-center mt-3 text-gray" style="font-size:0.95rem">
      Don't have an account? <a href="signup.html" style="font-weight:600">Sign up free →</a>
    </p>
  </div>
</main>

<!-- Forgot Password Modal -->
<div id="forgotModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:9999;align-items:center;justify-content:center;padding:1.5rem">
  <div style="background:white;border-radius:var(--radius);padding:2rem;max-width:420px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,0.2)">
    <h2 style="font-size:1.25rem;color:var(--navy);margin-bottom:0.4rem;font-weight:800">Reset your password</h2>
    <p style="font-size:0.88rem;color:var(--gray-dark);margin-bottom:1.25rem">Enter your email and we'll send you a link to choose a new password.</p>
    <div id="forgotAlert"></div>
    <div class="form-group">
      <label class="form-label">Email Address</label>
      <input type="email" id="forgotEmail" placeholder="you@example.com" style="width:100%;box-sizing:border-box" />
    </div>
    <button onclick="submitForgot()" id="forgotBtn" class="btn btn-primary w-full" style="margin-top:0.75rem">Send Reset Link</button>
    <button onclick="closeForgotModal()" style="width:100%;margin-top:0.6rem;background:none;border:none;color:var(--gray);font-size:0.88rem;cursor:pointer">Cancel</button>
  </div>
</div>

<script src="js/app.js"></script>
<script>
  // Redirect if already logged in
  if (Auth.isLoggedIn()) {
    const nextFromUrl = new URLSearchParams(location.search).get('next');
    window.location.href = nextFromUrl ? decodeURIComponent(nextFromUrl) : 'dashboard.html';
  }

  function togglePass() {
    const p = document.getElementById('password');
    p.type = p.type === 'password' ? 'text' : 'password';
  }

  async function doLogin(email, password) {
    const btn = document.getElementById('submitBtn');
    const alertBox = document.getElementById('alertBox');
    alertBox.innerHTML = '';
    setLoading(btn, true, 'Log In');

    try {
      const data = await apiFetch('/auth/login', {
        method: 'POST',
        body: JSON.stringify({ email, password })
      });
      Auth.setSession(data.token, data.user);
      const _loginNext = new URLSearchParams(location.search).get('next');
      showAlert(alertBox, `Welcome back, ${data.user.full_name}! Redirecting…`, 'success');
      setTimeout(() => { window.location.href = _loginNext ? decodeURIComponent(_loginNext) : 'dashboard.html'; }, 1000);
    } catch (err) {
      showAlert(alertBox, err.message || 'Login failed. Please try again.');
      // Surface a clear reset path right where they hit the wrong-password error
      alertBox.insertAdjacentHTML('beforeend',
        `<div style="text-align:center;margin-top:0.6rem;font-size:0.9rem"><a href="#" onclick="showForgotModal();return false" style="color:var(--orange);font-weight:600">Forgot your password? Reset it →</a></div>`);
      setLoading(btn, false, 'Log In');
    }
  }

  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    await doLogin(email, password);
  });

  function showForgotModal() {
    const m = document.getElementById('forgotModal');
    m.style.display = 'flex';
    document.getElementById('forgotAlert').innerHTML = '';
    document.getElementById('forgotEmail').value = document.getElementById('email').value || '';
    document.getElementById('forgotEmail').focus();
  }
  function closeForgotModal() {
    document.getElementById('forgotModal').style.display = 'none';
  }
  document.getElementById('forgotModal').addEventListener('click', (e) => {
    if (e.target === document.getElementById('forgotModal')) closeForgotModal();
  });

  async function submitForgot() {
    const btn = document.getElementById('forgotBtn');
    const alert = document.getElementById('forgotAlert');
    const email = document.getElementById('forgotEmail').value.trim();
    if (!email) { showAlert(alert, 'Please enter your email address.'); return; }
    setLoading(btn, true, 'Send Reset Link');
    alert.innerHTML = '';
    try {
      await apiFetch('/auth/forgot-password', { method: 'POST', body: JSON.stringify({ email }) });
      showAlert(alert, 'Check your inbox — if that email is registered, a reset link is on its way.', 'success');
      btn.style.display = 'none';
    } catch (err) {
      showAlert(alert, err.message || 'Something went wrong. Please try again.');
      setLoading(btn, false, 'Send Reset Link');
    }
  }
</script>
</body>
</html>
