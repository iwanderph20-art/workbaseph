<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Signing you in… — WorkBase PH</title>
  <link rel="icon" href="images/logo.svg?v=3" type="image/svg+xml" />
  <link rel="stylesheet" href="css/styles.css" />
  <style>
    body { display:flex; align-items:center; justify-content:center; min-height:100vh; background:var(--bg); }
    .cb-card { text-align:center; max-width:380px; padding:2.5rem 2rem; }
    .spinner { width:40px; height:40px; border:3px solid var(--gray-light); border-top-color:var(--orange); border-radius:50%; animation:spin .7s linear infinite; margin:0 auto 1.25rem; }
    @keyframes spin { to { transform:rotate(360deg); } }
  </style>
</head>
<body>
<div class="cb-card card">
  <div class="spinner"></div>
  <p style="font-weight:700;color:var(--navy);font-size:1rem;margin-bottom:0.35rem">Signing you in…</p>
  <p style="font-size:0.875rem;color:var(--gray)">Hold on while we set up your session.</p>
</div>
<script src="js/app.js?v=2"></script>
<script>
  (function() {
    const p = new URLSearchParams(location.search);
    const token = p.get('token');
    const next  = p.get('next') || '/dashboard.html';
    let user = null;
    try { user = JSON.parse(decodeURIComponent(p.get('user') || '')); } catch {}
    if (token && user) {
      Auth.setSession(token, user);
      history.replaceState(null, '', '/auth-callback.html');
      window.location.href = decodeURIComponent(next);
    } else {
      window.location.href = '/login.html?error=session_failed';
    }
  })();
</script>
</body>
</html>
